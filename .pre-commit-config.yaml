repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: "Ruff linter"
        args: [ netbox_routing/ ]
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        name: "Black"
        exclude: ^netbox_routing/migrations/
        args: [ --check, ]
